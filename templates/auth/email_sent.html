<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Your Email — Provenance</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#08080A">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4G21HCX2D0"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4G21HCX2D0');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--text:#F5F1E9;--text-light:rgba(245,241,233,0.45);
  --bg:#08080A;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono',monospace;
}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,72,64,0.3)}
.nav-wordmark{font-family:var(--serif);font-size:1.1rem;font-weight:400;color:#F5F1E9;text-decoration:none}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 1rem 4rem}
.auth-card{width:100%;max-width:400px;text-align:center}
.check-icon{font-size:2.5rem;margin-bottom:1.5rem;opacity:0.8}
.auth-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.auth-title{font-family:var(--serif);font-size:2rem;font-weight:600;letter-spacing:-0.5px;margin-bottom:0.75rem}
.auth-body{font-size:0.875rem;color:var(--text-light);line-height:1.7;margin-bottom:2rem}
.back-link{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);text-decoration:none}
.back-link:hover{text-decoration:underline}
.about-footer{border-top:1px solid rgba(74,72,64,0.3);padding:2rem;display:flex;align-items:center;justify-content:space-between;max-width:780px;margin:0 auto;flex-wrap:wrap;gap:1rem}
.footer-links{display:flex;gap:2rem;flex-wrap:wrap}
.footer-links a{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6962;text-decoration:none;transition:color 180ms}
.footer-links a:hover{color:#C9A84C}
.footer-wm{font-family:var(--serif);font-size:13px;font-weight:400;color:#3A3835}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-wordmark">Provenance</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="check-icon">✉</div>
    <div class="auth-eyebrow">Check your inbox</div>
    <h1 class="auth-title">Email on its way</h1>
    <p class="auth-body">
      If an account exists for that address, a password reset link is on its way.
      Check your spam folder if it doesn't arrive within a few minutes.
    </p>
    <a href="/auth/login" class="back-link">← Back</a>
  </div>
</div>

<footer style="width:100%">
  <div class="about-footer">
    <div class="footer-links">
      <a href="/about">About</a>
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </div>
    <span class="footer-wm">Provenance</span>
  </div>
</footer>
</body>
</html>
