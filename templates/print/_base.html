<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block page_title %}Provenance{% endblock %}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

@page {
  size: A4 portrait;
  margin: 2cm;
  @bottom-left {
    content: "Provenance · provenance.kitchen";
    font-family: 'DM Mono', monospace;
    font-size: 8pt;
    font-weight: 400;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #807462;
  }
  @bottom-center {
    content: "Page " counter(page) " of " counter(pages);
    font-family: 'DM Mono', monospace;
    font-size: 8pt;
    font-weight: 400;
    letter-spacing: 0.10em;
    color: #807462;
  }
  @bottom-right {
    content: "{{ gen_stamp }}";
    font-family: 'DM Mono', monospace;
    font-size: 8pt;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #807462;
  }
}

body {
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  color: #1f1b16;
  margin: 0;
  padding: 0;
  background: #F5F1E9;
}

/* ── Page header ── */
.pdf-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 5mm;
}
.pdf-brand {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: 14pt;
  font-weight: 400;
  color: #C9A84C;
}
.pdf-doctype {
  font-family: 'DM Mono', monospace;
  font-size: 9pt;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: #1f1b16;
}

/* ── Title ── */
.pdf-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20pt;
  font-weight: 400;
  letter-spacing: -0.005em;
  line-height: 1.15;
  color: #1f1b16;
  margin: 0;
}
.pdf-title-clause {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: 15pt;
  font-weight: 400;
  color: #4a3f33;
  margin-top: 1.5mm;
}

/* ── Gold rule ── */
.pdf-gold-rule {
  width: 100%;
  height: 1px;
  background: #C9A84C;
  border: none;
  margin: 5mm 0 4mm 0;
}

/* ── Meta strip ── */
.pdf-meta {
  font-family: 'DM Mono', monospace;
  font-size: 8pt;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: #807462;
  margin-bottom: 8mm;
}

{% block extra_styles %}{% endblock %}
</style>
</head>
<body>

<div class="pdf-head">
  <span class="pdf-brand">Provenance</span>
  <span class="pdf-doctype">{% block doctype %}Document{% endblock %}</span>
</div>

<div class="pdf-title">
  {% block title %}{% endblock %}
  {% block title_clause %}{% endblock %}
</div>

<hr class="pdf-gold-rule">

<div class="pdf-meta">{% block meta %}{% endblock %}</div>

{% block body %}{% endblock %}

</body>
</html>
